{% extends "layout.html" %}
{% block content %}

<style>
  /* ── LOGIN PAGE SPECIFIC ───────────────────────────── */
  .login-wrapper {
    min-height: calc(100vh - 68px - 72px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(13,27,42,0.12), 0 2px 8px rgba(13,27,42,0.06);
    animation: slideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Header stripe */
  .login-header {
    background: var(--navy);
    padding: 32px 36px 28px;
    position: relative;
    overflow: hidden;
  }

  .login-header::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: var(--orange);
  }

  .login-header::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    border-radius: 50%;
    background: rgba(245,91,0,0.08);
  }

  .login-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .login-logo-icon {
    width: 40px; height: 40px;
    background: var(--orange);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .login-logo-icon svg { fill: #fff; }

  .login-logo-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .login-logo-text span { color: var(--orange-light); }

  .login-tagline {
    font-size: 0.82rem;
    color: var(--grey);
    font-weight: 500;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  /* Body */
  .login-body {
    padding: 36px 36px 28px;
  }

  .login-body h5 {
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .login-body .subtitle {
    font-size: 0.84rem;
    color: var(--grey);
    margin-bottom: 28px;
  }

  /* Form controls */
  .form-label {
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--navy-mid);
    margin-bottom: 6px;
  }

  .form-control {
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    border: 1.5px solid #dde3ea;
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--navy);
    background: #fafbfc;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
  }

  .form-control:focus {
    border-color: var(--orange);
    box-shadow: 0 0 0 3px rgba(245,91,0,0.12);
    background: #fff;
    outline: none;
  }

  .form-control::placeholder { color: #b0bcc8; }

  /* Buttons */
  .btn-signin {
    background: var(--orange);
    color: #fff;
    font-family: 'Barlow', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    border: none;
    border-radius: 6px;
    padding: 12px;
    width: 100%;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
  }

  .btn-signin::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%);
    transition: transform 0.5s;
  }

  .btn-signin:hover {
    background: var(--orange-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(245,91,0,0.35);
  }

  .btn-signin:hover::after { transform: translateX(100%); }

  .btn-signin:active { transform: translateY(0); }

  .btn-track-outline {
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--navy-mid);
    background: transparent;
    border: 1.5px solid #dde3ea;
    border-radius: 6px;
    padding: 11px;
    width: 100%;
    text-align: center;
    text-decoration: none;
    display: block;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }

  .btn-track-outline:hover {
    border-color: var(--orange);
    color: var(--orange);
    background: rgba(245,91,0,0.04);
  }

  /* Divider */
  .or-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
  }

  .or-divider::before,
  .or-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e8ecf0;
  }

  .or-divider span {
    font-size: 0.75rem;
    color: #b0bcc8;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Footer */
  .login-footer {
    padding: 16px 36px;
    background: #f8f9fb;
    border-top: 1px solid #edf0f3;
    text-align: center;
  }

  .login-footer small {
    font-size: 0.77rem;
    color: var(--grey);
    font-weight: 500;
  }

  .login-footer small a {
    color: var(--orange);
    text-decoration: none;
    font-weight: 600;
  }
</style>

<div class="login-wrapper">
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">
        <div class="login-logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-.5 1.5 1.96 2.5H17V9.5h2.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2.22-3c-.55-.61-1.33-1-2.22-1s-1.67.39-2.22 1H3V6h12v9H8.22zm9.78 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        </div>
        <div class="login-logo-text">Swift<span>Track</span></div>
      </div>
      <div class="login-tagline">Client Management Portal</div>
    </div>

    <!-- Body -->
    <div class="login-body">
      <h5>Welcome back</h5>
      <p class="subtitle">Sign in to access your logistics dashboard</p>

      <form action="/login" method="POST">
        <div class="mb-3">
          <label class="form-label">Username / Client ID</label>
          <input type="text" name="username" class="form-control" placeholder="e.g. VENDOR_01" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-signin">Sign In</button>

        <div class="or-divider"><span>or</span></div>

        <a href="/track" class="btn-track-outline">Track an Order</a>
      </form>
    </div>

    <!-- Footer -->
    <div class="login-footer">
      <small>SwiftLogistics (Pvt) Ltd. &nbsp;·&nbsp; <a href="#">Need help?</a></small>
    </div>

  </div>
</div>

{% endblock %}
