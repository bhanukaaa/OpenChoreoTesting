<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SwiftTrack CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --orange:       #F55B00;
        --orange-light: #FF7A2F;
        --orange-dark:  #C94800;
        --navy:         #0D1B2A;
        --navy-mid:     #162535;
        --navy-soft:    #1E3248;
        --white:        #FFFFFF;
        --off-white:    #F4F6F8;
        --grey:         #8A9BB0;
        --border:       rgba(255,255,255,0.08);
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        font-family: 'Barlow', sans-serif;
        background: var(--off-white);
        color: var(--navy);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
      }

      /* ── CARD ──────────────────────────────────────────── */
      .cms-card {
        width: 100%;
        max-width: 560px;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(13,27,42,0.12), 0 2px 8px rgba(13,27,42,0.06);
        animation: slideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Header */
      .cms-header {
        background: var(--navy);
        padding: 28px 32px 24px;
        position: relative;
        overflow: hidden;
      }

      .cms-header::before {
        content: '';
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 3px;
        background: var(--orange);
      }

      .cms-header::after {
        content: '';
        position: absolute;
        top: -40px; right: -40px;
        width: 140px; height: 140px;
        border-radius: 50%;
        background: rgba(245,91,0,0.08);
        pointer-events: none;
      }

      .cms-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .cms-logo-icon {
        width: 38px; height: 38px;
        background: var(--orange);
        border-radius: 7px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }

      .cms-logo-icon svg { fill: #fff; }

      .cms-logo-text {
        font-family: 'Barlow Condensed', sans-serif;
        font-weight: 800;
        font-size: 1.55rem;
        color: #fff;
        letter-spacing: 0.5px;
      }

      .cms-logo-text span { color: var(--orange-light); }

      .cms-tagline {
        font-size: 0.78rem;
        color: var(--grey);
        font-weight: 600;
        letter-spacing: 0.6px;
        text-transform: uppercase;
      }

      /* Body */
      .cms-body { padding: 32px; }

      .cms-body h5 {
        font-family: 'Barlow', sans-serif;
        font-weight: 700;
        font-size: 1.05rem;
        color: var(--navy);
        margin-bottom: 4px;
      }

      .cms-body .subtitle {
        font-size: 0.84rem;
        color: var(--grey);
        margin-bottom: 24px;
      }

      /* Form */
      .input-row {
        display: flex;
        gap: 10px;
      }

      .cms-input {
        flex: 1;
        font-family: 'Barlow', sans-serif;
        font-size: 0.95rem;
        border: 1.5px solid #dde3ea;
        border-radius: 6px;
        padding: 10px 14px;
        color: var(--navy);
        background: #fafbfc;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .cms-input:focus {
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(245,91,0,0.12);
        outline: none;
        background: #fff;
      }

      .cms-input::placeholder { color: #b0bcc8; }

      .btn-place {
        font-family: 'Barlow', sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        background: var(--orange);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 22px;
        cursor: pointer;
        transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        white-space: nowrap;
      }

      .btn-place:hover {
        background: var(--orange-light);
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(245,91,0,0.35);
      }

      .btn-place:active { transform: translateY(0); }

      /* Log Section */
      .log-label {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--navy-mid);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .log-label .log-dot {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--orange);
        display: inline-block;
      }

      #log {
        background: var(--navy);
        color: #7dd3a8;
        font-family: 'Courier New', monospace;
        font-size: 0.82rem;
        line-height: 1.7;
        padding: 16px 18px;
        border-radius: 8px;
        min-height: 110px;
        overflow-y: auto;
        border: 1px solid rgba(255,255,255,0.06);
        word-break: break-all;
      }

      #log .log-prompt {
        color: var(--orange-light);
        font-weight: 700;
        margin-right: 4px;
      }

      /* Footer */
      .cms-footer {
        padding: 14px 32px;
        background: #f8f9fb;
        border-top: 1px solid #edf0f3;
        text-align: center;
      }

      .cms-footer small {
        font-size: 0.76rem;
        color: var(--grey);
        font-weight: 500;
      }
    </style>
  </head>
  <body>

    <div class="cms-card">

      <!-- Header -->
      <div class="cms-header">
        <div class="cms-logo">
          <div class="cms-logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24">
              <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-.5 1.5 1.96 2.5H17V9.5h2.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm2.22-3c-.55-.61-1.33-1-2.22-1s-1.67.39-2.22 1H3V6h12v9H8.22zm9.78 3c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
            </svg>
          </div>
          <div class="cms-logo-text">Swift<span>Track</span></div>
        </div>
        <div class="cms-tagline">Content Management System</div>
      </div>

      <!-- Body -->
      <div class="cms-body">
        <h5>Simulate a Purchase</h5>
        <p class="subtitle">Enter a User ID to trigger an order through the system</p>

        <form id="orderForm">
          <div class="input-row mb-4">
            <input type="text" name="user_id" class="cms-input" placeholder="User ID (e.g. 123)" required />
            <button type="submit" class="btn-place">Place Order</button>
          </div>
        </form>

        <div class="log-label">
          <span class="log-dot"></span>
          System Logs — Live
        </div>
        <div id="log"><span class="log-prompt">▸</span> Waiting for order…</div>
      </div>

      <!-- Footer -->
      <div class="cms-footer">
        <small>SwiftLogistics (Pvt) Ltd. &nbsp;·&nbsp; Internal CMS Tool</small>
      </div>

    </div>

    <script>
      document.getElementById("orderForm").onsubmit = async (e) => {
        e.preventDefault();
        const log = document.getElementById("log");
        const formData = new FormData(e.target);
        const userId = formData.get("user_id");

        log.innerHTML = `<span class="log-prompt">▸</span> Sending request for User <strong style="color:#fff">${userId}</strong>…`;

        try {
          const res = await fetch("/submit-order", { method: "POST", body: formData });
          const data = await res.json();
          log.innerHTML += `<br><span class="log-prompt">✓</span> Server Response: <span style="color:#93c5fd">${JSON.stringify(data)}</span>`;
        } catch (err) {
          log.innerHTML += `<br><span style="color:#f87171">✗ Error: ${err.message}</span>`;
        }
      };
    </script>

  </body>
</html>
